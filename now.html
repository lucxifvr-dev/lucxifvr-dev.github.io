<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>// now — lucxifvr</title>
<link rel="icon" type="image/png" href="img/blackarch.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{background:#0b0b0b;}
html,body{
    background:#0b0b0b;color:#e8e8e8;
    font-family:'Courier New',Courier,monospace;
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    opacity:0;animation:fadeIn 1.2s ease 0.1s forwards;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

.terminal{
    width:min(640px,92vw);
    background:#0f0f0f;
    border:1px solid rgba(255,255,255,0.10);
    border-radius:10px;overflow:hidden;
    display:flex;flex-direction:column;
    max-height:88vh;
}
.term-bar{
    background:#181818;padding:10px 16px;
    display:flex;align-items:center;gap:8px;
    border-bottom:1px solid rgba(255,255,255,0.07);flex-shrink:0;
}
.dot{width:11px;height:11px;border-radius:50%;}
.dot.r{background:#ff5f57;} .dot.y{background:#febc2e;} .dot.g{background:#28c840;}
.term-title{flex:1;text-align:center;font-size:11px;color:rgba(255,255,255,0.28);letter-spacing:1px;}

.term-body{
    padding:22px 24px;overflow-y:auto;flex:1;
    display:flex;flex-direction:column;
    min-height:320px;
}
.term-body::-webkit-scrollbar{width:3px;}
.term-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}

.line{font-size:12.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word;}
.line.cmd{color:rgba(255,255,255,0.30);}
.line.out{color:rgba(255,255,255,0.72);}
.line.green{color:#28c840;}
.line.red{color:#ff6060;}
.line.yellow{color:#ffb400;}
.line.dim{color:rgba(255,255,255,0.22);font-size:11px;}
.line.empty{line-height:1.2;}

.term-input-row{
    display:flex;align-items:center;gap:6px;
    padding:12px 24px 16px;border-top:1px solid rgba(255,255,255,0.06);
    flex-shrink:0;
}
.term-prompt-sym{color:rgba(255,255,255,0.35);font-size:12.5px;white-space:nowrap;}
.term-input{
    background:transparent;border:none;outline:none;
    color:#e8e8e8;font-family:'Courier New',monospace;font-size:12.5px;
    flex:1;caret-color:#e8e8e8;
}

.afk-overlay{
    position:fixed;inset:0;background:#0b0b0b;z-index:9000;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity 1s ease;
}
.afk-overlay.active{opacity:1;pointer-events:all;}
.afk-text{font-size:12px;color:rgba(255,255,255,0.13);letter-spacing:2px;animation:afkFloat 6s ease-in-out infinite;}
@keyframes afkFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

.back{margin-top:16px;font-size:11px;color:rgba(255,255,255,0.22);text-decoration:none;letter-spacing:1px;transition:color 0.2s;}
.back:hover{color:rgba(255,255,255,0.6);}

@media (max-width: 600px) {
    .terminal { border-radius: 0; border-left: none; border-right: none; max-height: 100vh; }
    html, body { justify-content: flex-start; }
    .term-body { min-height: 200px; padding: 14px 14px; }
    .term-bar { padding: 8px 12px; }
    .dot { width: 9px; height: 9px; }
    .term-title { font-size: 10px; }
    .line { font-size: 11.5px; }
    .term-input-row { padding: 10px 14px 12px; }
    .term-prompt-sym { font-size: 11px; }
    .term-input { font-size: 11px; }
    .back { font-size: 10px; margin-top: 10px; }
}
</style>
</head>
<body>

<div class="terminal">
    <div class="term-bar">
        <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
        <span class="term-title">lucxifvr@blackarch ~ — now</span>
    </div>
    <div class="term-body" id="termBody"></div>
    <div class="term-input-row">
        <span class="term-prompt-sym">lucxifvr@blackarch ~ $</span>
        <input class="term-input" id="termInput" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="escribe un comando...">
    </div>
</div>

<a class="back" href="index.html">← volver al inicio</a>

<div class="afk-overlay" id="afkOverlay" onclick="wakeUp()">
    <div class="afk-text">> away from keyboard_</div>
</div>

<script>
const body = document.getElementById('termBody');
const input = document.getElementById('termInput');

function addLine(text, cls='out', delay=0){
    return new Promise(res=>{
        setTimeout(()=>{
            const d=document.createElement('div');
            d.className='line '+(cls||'out');
            d.textContent=text;
            body.appendChild(d);
            body.scrollTop=body.scrollHeight;
            res();
        },delay);
    });
}

function addEmpty(){return addLine('','empty');}

async function boot(){
    await addLine('lucxifvr@blackarch ~ — now.txt','green');
    await addEmpty();
    await addLine('> Learning:    Python · JS · C++ · Cybersec (soon)','out',60);
    await addLine('> Working on:  my destiny','out',120);
    await addLine('> Reading:     Blackarch Linux · docs','out',180);
    await addEmpty();
    await addLine('> OS:     Blackarch Linux','out',260);
    await addLine('> Editor: VS Code','out',310);
    await addLine('> Shell:  zsh','out',360);
    await addLine('> WM:   Hyperland','out',410);
    await addEmpty();
    await addLine('> building. always building.','out',440);
    await addEmpty();
    await addLine('// escribe "help" para ver los comandos disponibles.','dim',520);
    await addEmpty();
}
boot();

const COMMANDS = {
    help(){
        addEmpty();
        addLine('Available commands:','green');
        addEmpty();
        addLine('  help              — muestra este menú','out',60);
        addLine('  whoami            — ¿ quién soy ?','out',120);
        addLine('  skills            — mis habilidades','out',180);
        addLine('  ping lucxifvr     — mi ubicacion actual','out',240);
        addLine('  cat now.txt       — lo que estoy haciendo','out',300);
        addLine('  ls projects/      — lista de proyectos','out',360);
        addLine('  sudo rm -rf /     — Comando de emergencia.','out',420);
        addLine('  clear             — limpia la terminal','out',480);
        addLine('  exit              — volver al inicio','out',540);
        addEmpty();
    },
    whoami(){
        addEmpty();
        addLine('lucxifvr','green');
        addLine('  Edad:      16 años');
        addLine('  Ubicación: Rusia (🇷🇺)');
        addLine('  Rol:       Dev en formación');
        addLine('  Intereses: Python · JS · C++ · Cybersecurity · Blackarch Linux');
        addEmpty();
    },
    skills(){
        addEmpty();
        addLine('habilidades:','green');
        addEmpty();
        addLine('  Python     ████████░░  80%');
        addLine('  HTML/CSS   ███████░░░  70%');
        addLine('  Java       █████░░░░░  50%');
        addLine('  C++        ████░░░░░░  40%');
        addLine('  JSON       ██████░░░░  60%');
        addLine('  Linux      ██████░░░░  65%');
        addEmpty();
        addLine('// en constante crecimiento','dim');
        addEmpty();
    },
    'ping lucxifvr'(){
        addEmpty();
        addLine('PING lucxifvr.dev (185.22.153.47) 56 bytes of data.','out');
        setTimeout(()=>addLine('64 bytes from 185.22.153.47: icmp_seq=1 ttl=54 time=143 ms'),300);
        setTimeout(()=>addLine('64 bytes from 185.22.153.47: icmp_seq=2 ttl=54 time=141 ms'),900);
        setTimeout(()=>addLine('64 bytes from 185.22.153.47: icmp_seq=3 ttl=54 time=138 ms'),1500);
        setTimeout(()=>{
            addEmpty();
            addLine('--- lucxifvr.dev ping statistics ---');
            addLine('3 packets transmitted, 3 received, 0% packet loss');
            addLine('rtt min/avg/max = 138/140/143 ms');
            addLine('ip origin: Moscow, RU (🇷🇺) ');
            addEmpty();
        },2200);
    },
    'cat now.txt'(){
        addEmpty();
        addLine('// lo que estoy haciendo ahora','green');
        addEmpty();
        addLine('  aprendiendo python y c++ de forma autodidacta.');
        addLine('  construyendo mi imperio digital, un proyecto a la vez.');
        addLine('  próximamente: ciberseguridad.');
        addEmpty();
        addLine('last update: jun 2026','dim');
        addEmpty();
    },
    'ls projects/'(){
        addEmpty();
        addLine('total 3','out');
        addLine('  My Website/    [HTML]   Terminado');
        addLine('  Bot Discord/    [Python]      Terminado');
        addLine('  Netflix Checker/    [Tool]     Abandonado');
        addEmpty();
    },
    'sudo rm -rf /'(){
        addEmpty();
        addLine('sudo: se requiere contraseña para root:','yellow');
        setTimeout(()=>addLine('[sudo] password for lucxifvr: '),500);
        setTimeout(()=>addLine('Permission denied. Nice try.:)','red'),1400);
        setTimeout(()=>addLine('// Power On','dim'),1900);
        addEmpty();
    },
    clear(){
        body.innerHTML='';
    },
    exit(){
        addEmpty();
        addLine('cerrando sesión...','dim');
        setTimeout(()=>{ window.location.href='index.html'; },900);
    }
};

function runCommand(raw){
    const cmd = raw.trim().toLowerCase();
    if(!cmd) return;

    const d=document.createElement('div');
    d.className='line cmd';
    d.textContent='lucxifvr@blackarch ~ $ '+raw;
    body.appendChild(d);
    body.scrollTop=body.scrollHeight;

    if(COMMANDS[cmd]){
        COMMANDS[cmd]();
    } else {
        addEmpty();
        addLine('comando no encontrado: '+cmd,'red');
        addLine('// escribe "help" para ver los disponibles','dim');
        addEmpty();
    }
}

input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
        const val=input.value;
        input.value='';
        runCommand(val);
        resetAfk();
    }
});

document.querySelector('.terminal').addEventListener('click',()=>input.focus());
setTimeout(()=>input.focus(), 600);

let afkTimer;
function resetAfk(){
    clearTimeout(afkTimer);
    document.getElementById('afkOverlay').classList.remove('active');
    afkTimer=setTimeout(()=>document.getElementById('afkOverlay').classList.add('active'),120000);
}
function wakeUp(){document.getElementById('afkOverlay').classList.remove('active');resetAfk();input.focus();}
['mousemove','keydown','click','touchstart'].forEach(ev=>document.addEventListener(ev,resetAfk));
resetAfk();
</script>
</body>
</html>
