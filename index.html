<script>
(function() {
    const born = new Date(2010, 1, 26);
    const now = new Date();
    let age = now.getFullYear() - born.getFullYear();
    const m = now.getMonth() - born.getMonth();
    if (m < 0 || (m === 0 && now.getDate() < born.getDate())) age--;
    document.getElementById('ageText').textContent = '> ' + age + ' years old';
})();

function copyDiscord(){
    navigator.clipboard.writeText(".lucxifvr_").then(() => {
        const fb = document.getElementById("copy-feedback");
        fb.classList.add("show");
        setTimeout(() => fb.classList.remove("show"), 1800);
    });
}

document.addEventListener("DOMContentLoaded", () => {
    const delays = [300,450,600,750,900,1050];
    document.querySelectorAll(".social-btn").forEach((btn,i) => {
        setTimeout(() => btn.classList.add("visible"), delays[i]);
    });
    setTimeout(() => {
        const pb = document.querySelector(".portfolio-btn");
        if (pb) pb.classList.add("visible");
    }, 1200);

    const el = document.getElementById("statusText");
    const base = "> status: building";
    el.textContent = "";
    setTimeout(() => {
        let i = 0;
        function typeBase() {
            if (i < base.length) { el.textContent = base.slice(0,i+1); i++; setTimeout(typeBase,28); }
            else addDot(0);
        }
        typeBase();
        function addDot(idx) {
            if (idx >= 3) return;
            let blinks=0, visible=true;
            const dotStr = ".".repeat(idx+1);
            const interval = setInterval(() => {
                visible = !visible;
                el.textContent = base + (visible ? dotStr : dotStr.slice(0,-1));
                blinks++;
                if (blinks >= 3) { clearInterval(interval); el.textContent = base+dotStr; setTimeout(()=>addDot(idx+1),400); }
            }, 260);
        }
    }, 1800);

    const LASTFM_USER = "lucxifvr_";
    const LASTFM_KEY  = "38e6120004a15724f666b72a308eba60";
    let _lastTrack = "";

    async function fetchSpotify(){
        try {
            const res = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USER}&api_key=${LASTFM_KEY}&format=json&limit=1`);
            const data = await res.json();
            const track = data.recenttracks.track[0];
            const isPlaying = track["@attr"] && track["@attr"].nowplaying === "true";

            document.getElementById("spTrack").textContent  = track.name;
            document.getElementById("spArtist").textContent = track.artist["#text"];
            document.getElementById("spBar").style.opacity  = isPlaying ? "1" : "0.3";

            const imgUrl = track.image && track.image.length ? track.image[track.image.length-1]["#text"] : "";
            if(imgUrl){
                const artEl = document.getElementById("spArt");
                const trackKey = track.name + "|" + track.artist["#text"];
                if(_lastTrack !== trackKey){
                    _lastTrack = trackKey;
                    artEl.innerHTML = `<img src="${imgUrl}" alt="cover">`;
                }
            }
        } catch(e){}
    }
    fetchSpotify();
    setInterval(fetchSpotify, 10000);

    let afkTimer;
    function resetAfk(){
        clearTimeout(afkTimer);
        document.getElementById('afkOverlay').classList.remove('active');
        afkTimer = setTimeout(()=>document.getElementById('afkOverlay').classList.add('active'), 120000);
    }
    window.wakeUp = function(){ document.getElementById('afkOverlay').classList.remove('active'); resetAfk(); };
    ['mousemove','keydown','click','touchstart'].forEach(e=>document.addEventListener(e,resetAfk));
    resetAfk();
});
</script>

<div class="afk-overlay" id="afkOverlay" onclick="wakeUp()">

<script src="animations.js"></script>

<script>
document.getElementById('footerYear').textContent = new Date().getFullYear();

const dot = document.getElementById('cursorDot');
document.addEventListener('mousemove', e => {
    dot.style.left = e.clientX + 'px';
    dot.style.top  = e.clientY + 'px';
});
document.addEventListener('mousedown', () => dot.classList.add('clicking'));
document.addEventListener('mouseup',   () => dot.classList.remove('clicking'));

const canvas = document.getElementById('rain-canvas');
const ctx = canvas.getContext('2d');

function resizeRain() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeRain();
window.addEventListener('resize', resizeRain);

const drops = Array.from({length: 120}, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    len: Math.random() * 14 + 6,
    speed: Math.random() * 2.5 + 1.2,
    opacity: Math.random() * 0.4 + 0.1,
    width: Math.random() * 0.6 + 0.3
}));

function drawRain() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drops.forEach(d => {
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - 1, d.y + d.len);
        ctx.strokeStyle = `rgba(160,200,255,${d.opacity})`;
        ctx.lineWidth = d.width;
        ctx.stroke();

        d.y += d.speed;
        if (d.y > canvas.height + d.len) {
            d.y = -d.len;
            d.x = Math.random() * canvas.width;
        }
    });
    requestAnimationFrame(drawRain);
}
drawRain();
</script>
